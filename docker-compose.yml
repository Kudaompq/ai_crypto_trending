services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto_trending}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_trending}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crypto-backend
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - backend-data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
      - WATCHLIST_DATABASE_URL=postgres://${POSTGRES_USER:-crypto_trending}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crypto_trending}?sslmode=disable
      - AI_CHAT_ENDPOINT=${AI_CHAT_ENDPOINT:-}
      - AI_CHAT_API_KEY=${AI_CHAT_API_KEY:-}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-}
      - AI_CHAT_TIMEOUT=${AI_CHAT_TIMEOUT:-20s}
      - SCHEDULED_ANALYSIS_ENABLED=${SCHEDULED_ANALYSIS_ENABLED:-false}
      - SCHEDULED_ANALYSIS_CONCURRENCY=${SCHEDULED_ANALYSIS_CONCURRENCY:-4}
      - SCHEDULED_ANALYSIS_SYMBOL_TIMEOUT=${SCHEDULED_ANALYSIS_SYMBOL_TIMEOUT:-2m}
      - SCHEDULED_ANALYSIS_MAX_DURATION=${SCHEDULED_ANALYSIS_MAX_DURATION:-50m}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - WECOM_TIMEOUT=${WECOM_TIMEOUT:-10s}
    networks:
      - crypto-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto-frontend
    restart: unless-stopped
    ports:
      - "9999:80"
    depends_on:
      - backend
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  crypto-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  backend-data:
    driver: local
